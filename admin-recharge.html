<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Recharge Review</title><style>body{font:16px Arial;background:#f3f6fb;color:#17243a;margin:0}.wrap{max-width:900px;margin:24px auto;padding:16px}.card{background:white;padding:20px;border:1px solid #dce5ef;border-radius:14px;margin:14px 0}input{padding:12px;border:1px solid #bbc8d8;border-radius:8px;width:min(100%,320px)}button{padding:10px 15px;border:0;border-radius:8px;background:#1459a6;color:white;margin:8px 6px 0 0;cursor:pointer}.reject{background:#a72c36}.item{border-top:1px solid #e2e8f0;padding:14px 0}.muted{color:#617087}</style></head><body><div class="wrap"><div class="card"><a href="index.html">← Home</a><h1>Admin — Recharge Approval</h1><p class="muted">Keep this page private. Configure ADMIN_PIN on the server before use.</p><input id="pin" type="password" placeholder="Admin PIN"><button id="load">Load pending requests</button><div id="status"></div></div><div class="card"><h2>Pending payments</h2><div id="items">Enter admin PIN and load requests.</div></div></div><script>
const pin=()=>document.getElementById('pin').value;async function act(url){const r=await fetch(url,{method:'POST',headers:{'x-admin-pin':pin()}});const d=await r.json();if(!r.ok)throw Error(d.message);return d;}document.getElementById('load').onclick=async()=>{const box=document.getElementById('items'),s=document.getElementById('status');box.textContent='Loading…';try{const r=await fetch('https://nisar-digital-services-api.onrender.com/api/admin/recharges',{headers:{'x-admin-pin':pin()}}),d=await r.json();if(!r.ok)throw Error(d.message);s.textContent=d.requests.length+' pending request(s).';box.innerHTML='';if(!d.requests.length)box.textContent='No pending requests.';d.requests.forEach(x=>{const el=document.createElement('div');el.className='item';const p=document.createElement('p');p.textContent=`${x.name} | ${x.mobile} | ${x.role} | ₹${x.amount} | ${x.bank} | UTR: ${x.utr} | ID: ${x.id}`;el.appendChild(p);const a=document.createElement('button');a.textContent='Approve & credit wallet';a.onclick=async()=>{try{await act('/api/admin/recharges/'+x.id+'/approve');document.getElementById('load').click();}catch(e){s.textContent=e.message;}};const b=document.createElement('button');b.className='reject';b.textContent='Reject';b.onclick=async()=>{try{await act('/api/admin/recharges/'+x.id+'/reject');document.getElementById('load').click();}catch(e){s.textContent=e.message;}};el.append(a,b);box.appendChild(el);});}catch(e){s.textContent=e.message;box.textContent='';}};
</script></body></html>

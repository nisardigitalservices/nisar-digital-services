<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | NISAR DIGITAL SERVICES</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font:16px Arial,sans-serif}.wrap{max-width:560px;margin:35px auto;padding:16px}.card{background:#fff;border:1px solid #dce5ef;border-radius:16px;padding:24px}.card h1{font-size:25px}.muted{color:#617087;line-height:1.5}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #bcc9d8;border-radius:9px;font-size:16px}button{width:100%;padding:13px;background:#1459a6;color:#fff;border:0;border-radius:9px;font-weight:700;margin-top:18px}.msg{white-space:pre-wrap;margin-top:14px;font-weight:600}a{color:#1459a6}</style></head><body><main class="wrap"><section class="card"><a href="index.html">← Back to Login</a><h1>Partner Password Reset</h1><p class="muted">Enter your Partner ID, registered mobile number and current password. Your new password will become active only after Admin approval.</p><form id="resetForm"><label>Permanent Partner ID</label><input name="partnerId" required autocomplete="username"><label>Registered mobile number</label><input name="mobile" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"><label>Current password</label><input name="currentPassword" type="password" required autocomplete="current-password"><label>New password (minimum 8 characters)</label><input name="newPassword" type="password" minlength="8" required autocomplete="new-password"><label>Confirm new password</label><input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Submit for Admin Verification</button></form><div class="msg" id="message" aria-live="polite"></div></section></main><script>const API='https://nisar-digital-services-api.onrender.com';const form=document.getElementById('resetForm');form.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form));const m=document.getElementById('message');if(d.newPassword!==d.confirmPassword){m.textContent='New password and confirmation do not match.';return;}m.textContent='Submitting request…';try{const r=await fetch(API+'/api/partner/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const x=await r.json();if(!r.ok)throw Error(x.message||'Request failed');m.textContent=x.message+' Request ID: '+x.requestId;form.reset();}catch(err){m.textContent=err.message;}});</script></body></html>
